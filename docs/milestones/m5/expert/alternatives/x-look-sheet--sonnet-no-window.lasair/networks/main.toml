# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 5

[[node]]
id = 0
name = "looks"
type = "dat.table"
pos = [0.0, 0.0]
params.rows = '''
name	hue	zoom	blur
calm	0	1	2
wild	140	1.8	24'''

[[node]]
id = 1
name = "clouds"
type = "img.noise"
pos = [220.0, 0.0]
params.monochrome = false
params.octaves = 4
params.scale = 3
params.z = { value = 0.0, expr = "time*0.05" }

[[node]]
id = 2
name = "zoom"
type = "img.transform"
pos = [440.0, 0.0]
inputs.in = { node = 1, output = "out" }
params.scale = { value = [1.0, 1.0], expr = "op('looks')['wild','zoom']" }

[[node]]
id = 3
name = "hue"
type = "img.hsv_adjust"
pos = [660.0, 0.0]
inputs.in = { node = 2, output = "out" }
params.hue = { value = 0.0, expr = "op('looks')['wild','hue']" }

[[node]]
id = 4
name = "blur"
type = "img.blur"
pos = [880.0, 0.0]
inputs.in = { node = 3, output = "out" }
params.size = { value = 4.0, expr = "op('looks')['wild','blur']" }
