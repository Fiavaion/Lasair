# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 5

[[node]]
id = 0
name = "dot"
type = "img.shape"
pos = [0.0, 0.0]
params.centre = [0.65, 0.5]
params.shape = "circle"
params.size = { value = [0.06, 0.06], expr = "0.06 + 0.02 * sin(time * 3)" }

[[node]]
id = 1
name = "tail"
type = "img.feedback"
pos = [220.0, 0.0]
inputs.in = { node = 0, output = "out" }
inputs.loop = { node = 3, output = "out" }

[[node]]
id = 2
name = "swirl"
type = "img.transform"
pos = [440.0, 0.0]
inputs.in = { node = 1, output = "out" }
params.rotate = 2.0
params.scale = [1.01, 1.01]

[[node]]
id = 3
name = "mix"
type = "img.blend"
pos = [660.0, 0.0]
inputs.a = { node = 0, output = "out" }
inputs.b = { node = 2, output = "out" }
params.mix = 0.9

[[node]]
id = 4
name = "main_out"
type = "cmp.window"
pos = [880.0, 0.0]
inputs.in = { node = 3, output = "out" }
