# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 5

[[node]]
id = 0
name = "clouds"
type = "img.noise"
pos = [0.0, 0.0]
params.octaves = 4
params.scale = 2.0
params.z = { value = 0.0, expr = "time * 0.05" }

[[node]]
id = 1
name = "hex"
type = "img.shape"
pos = [220.0, 0.0]
params.background = [0, 0, 0, 1]
params.fill = [1, 1, 1, 1]
params.rotate = { value = 0.0, expr = "time * 30" }
params.shape = "polygon"
params.size = [0.6, 0.6]
params.softness = 0.004

[[node]]
id = 2
name = "glow"
type = "img.ramp"
pos = [440.0, 0.0]
params.colour_a = [1, 1, 1, 1]
params.colour_b = [0, 0, 0, 1]
params.type = "radial"

[[node]]
id = 3
name = "switcher"
type = "img.switch"
pos = [660.0, 0.0]
inputs.in0 = { node = 0, output = "out" }
inputs.in1 = { node = 1, output = "out" }
inputs.in2 = { node = 2, output = "out" }
inputs.in3 = { node = 0, output = "out" }
params.blend = true
params.index = { value = 0.0, expr = "3 * (time / 12 - floor(time / 12))" }

[[node]]
id = 4
name = "window"
type = "cmp.window"
pos = [880.0, 0.0]
inputs.in = { node = 3, output = "out" }
params.title = "Looks"
