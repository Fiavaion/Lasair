# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 6

[[node]]
id = 0
name = "pattern"
type = "img.noise"
pos = [0.0, 0.0]
params.scale = 6.0
params.z = { value = 0.0, expr = "time * 0.5" }

[[node]]
id = 1
name = "memory"
type = "img.feedback"
pos = [220.0, 0.0]
inputs.in = { node = 0, output = "out" }

[[node]]
id = 2
name = "drift"
type = "img.transform"
pos = [440.0, 0.0]
inputs.in = { node = 1, output = "out" }
params.scale = [1.01, 1.01]
params.translate = [0.0, 0.01]

[[node]]
id = 3
name = "fade"
type = "img.level"
pos = [660.0, 0.0]
inputs.in = { node = 2, output = "out" }
params.brightness = 0.9

[[node]]
id = 4
name = "accumulate"
type = "img.composite"
pos = [880.0, 0.0]
inputs.a = { node = 0, output = "out" }
inputs.b = { node = 3, output = "out" }
params.operation = "multiply"

[[node]]
id = 5
name = "stage_out"
type = "cmp.window"
pos = [1100.0, 0.0]
inputs.in = { node = 4, output = "out" }
