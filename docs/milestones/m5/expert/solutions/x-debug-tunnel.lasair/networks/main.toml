# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 14

[[node]]
id = 0
name = "clouds"
type = "img.noise"
pos = [0.0, 0.0]
params.monochrome = false
params.octaves = 4
params.scale = 3.0
params.z = { value = 0.0, expr = "time * 0.2" }

[[node]]
id = 1
name = "turn"
type = "img.transform"
pos = [220.0, 0.0]
inputs.in = { node = 0, output = "out" }
params.rotate = { value = 0.0, expr = "time * 6" }

[[node]]
id = 2
name = "fold"
type = "img.kaleidoscope"
pos = [440.0, 0.0]
inputs.in = { node = 1, output = "out" }
params.segments = 8

[[node]]
id = 3
name = "colour_swing"
type = "sig.lfo"
pos = [660.0, 0.0]
params.amplitude = 180.0
params.frequency = 0.05

[[node]]
id = 4
name = "colour"
type = "img.hsv_adjust"
pos = [880.0, 0.0]
inputs.in = { node = 2, output = "out" }
params.hue = { value = 0.0, bind = { node = 3 } }

[[node]]
id = 5
name = "memory"
type = "img.feedback"
pos = [1100.0, 0.0]
inputs.in = { node = 4, output = "out" }
inputs.loop = { node = 8, output = "out" }

[[node]]
id = 6
name = "spiral"
type = "img.transform"
pos = [1320.0, 0.0]
inputs.in = { node = 5, output = "out" }
params.rotate = 1.0
params.scale = [1.01, 1.01]

[[node]]
id = 7
name = "fade"
type = "img.level"
pos = [1540.0, 0.0]
inputs.in = { node = 6, output = "out" }
params.brightness = 0.94

[[node]]
id = 8
name = "accumulate"
type = "img.composite"
pos = [0.0, 140.0]
inputs.a = { node = 4, output = "out" }
inputs.b = { node = 7, output = "out" }
params.operation = "add"

[[node]]
id = 9
name = "glow"
type = "img.bloom"
pos = [220.0, 140.0]
inputs.in = { node = 8, output = "out" }

[[node]]
id = 10
name = "soft"
type = "img.blur"
pos = [440.0, 140.0]
inputs.in = { node = 9, output = "out" }
params.size = 2.0

[[node]]
id = 11
name = "main_out"
type = "cmp.window"
pos = [660.0, 140.0]
inputs.in = { node = 10, output = "out" }
params.title = "Main"

[[node]]
id = 12
name = "dead_glow"
type = "img.bloom"
pos = [880.0, 140.0]
params.intensity = 0.5

[[node]]
id = 13
name = "second_out"
type = "cmp.window"
pos = [1100.0, 140.0]
inputs.in = { node = 10, output = "out" }
params.title = "Second"
