# cargo-deny policy (CLAUDE.md rule 3, PRD §10): no GPL, LGPL-static or
# non-commercial code in core crates. Optional plugins that bind GPL code
# (lsr-plugin-link) must be excluded here when they gain such dependencies,
# and are never linked into core builds.

[graph]
all-features = false
# The platforms Lasair ships on (CLAUDE.md rule 6; Linux best-effort).
# Dependencies that exist only for other targets (wasm32, Android) are not
# checked: e.g. rustls-platform-verifier pulls webpki-root-certs
# (CDLA-Permissive-2.0) only on wasm32.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
# Add licences here only when a dependency needs them.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]

# Boost Software Licence (permissive, no attribution in binaries): clipper2-rust,
# pulled in by manifold-rust for msh.boolean (PRD A74, docs/spikes/msh-licences.md).
[[licenses.exceptions]]
crate = "clipper2-rust"
allow = ["BSL-1.0"]

# Fonts bundled by egui (epaint_default_fonts): OFL for Hack/Noto/Emoji,
# Ubuntu Font Licence for Ubuntu-Light. Both are permissive font licences.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
