# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 12

[[node]]
id = 0
name = "clouds"
type = "img.noise"
pos = [0.0, 0.0]
params.scale = 3.0
params.z = { value = 0.0, expr = "time * 0.2" }

[[node]]
id = 1
name = "sparkle"
type = "img.shape"
pos = [220.0, 0.0]
params.background = [0.0, 0.0, 0.0, 0.0]
params.shape = "circle"
params.size = [0.08, 0.08]

[[node]]
id = 2
name = "sparkle_tile"
type = "img.tile"
pos = [440.0, 0.0]
inputs.in = { node = 1, output = "out" }
params.repeat = [6.0, 6.0]

[[node]]
id = 3
name = "layer"
type = "img.composite"
pos = [660.0, 0.0]
inputs.a = { node = 2, output = "out" }
inputs.b = { node = 0, output = "out" }
params.operation = "over"

[[node]]
id = 4
name = "colour_walk"
type = "sig.lfo"
pos = [880.0, 0.0]
params.amplitude = 180.0
params.frequency = 0.02

[[node]]
id = 5
name = "tint"
type = "img.hsv_adjust"
pos = [1100.0, 0.0]
inputs.in = { node = 3, output = "out" }
params.hue = { value = 0.0, bind = { node = 4 } }

[[node]]
id = 6
name = "breath"
type = "sig.lfo"
pos = [1320.0, 0.0]
params.amplitude = 0.3
params.frequency = 0.25
params.offset = 0.7

[[node]]
id = 7
name = "dim"
type = "img.level"
pos = [1540.0, 0.0]
inputs.in = { node = 5, output = "out" }
params.brightness = { value = 1.0, bind = { node = 6 } }

[[node]]
id = 8
name = "glow"
type = "img.bloom"
pos = [0.0, 140.0]
inputs.in = { node = 7, output = "out" }

[[node]]
id = 9
name = "soften"
type = "img.blur"
pos = [220.0, 140.0]
inputs.in = { node = 8, output = "out" }
params.size = 1.0

[[node]]
id = 10
name = "size"
type = "img.resolution"
pos = [440.0, 140.0]
inputs.in = { node = 9, output = "out" }
params.fraction = 1.0
params.mode = "fraction"

[[node]]
id = 11
name = "main_out"
type = "cmp.window"
pos = [660.0, 140.0]
inputs.in = { node = 10, output = "out" }
params.height = 1080
params.title = "Projector"
params.width = 1920
