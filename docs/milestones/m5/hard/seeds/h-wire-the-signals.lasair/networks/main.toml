# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 6

[[node]]
id = 0
name = "pulse"
type = "sig.lfo"
pos = [0.0, 0.0]
params.amplitude = 0.3
params.frequency = 0.5
params.offset = 0.7

[[node]]
id = 1
name = "wander"
type = "sig.noise"
pos = [0.0, 140.0]
params.amplitude = 120.0
params.frequency = 0.15

[[node]]
id = 2
name = "mist"
type = "img.noise"
pos = [0.0, 280.0]
params.scale = 3.0

[[node]]
id = 3
name = "hue_shift"
type = "img.hsv_adjust"
pos = [220.0, 0.0]
inputs.in = { node = 2, output = "out" }
params.hue = 0.0

[[node]]
id = 4
name = "brightness_stage"
type = "img.level"
pos = [440.0, 0.0]
inputs.in = { node = 3, output = "out" }
params.brightness = 1.0

[[node]]
id = 5
name = "main_out"
type = "cmp.window"
pos = [660.0, 0.0]
inputs.in = { node = 4, output = "out" }
