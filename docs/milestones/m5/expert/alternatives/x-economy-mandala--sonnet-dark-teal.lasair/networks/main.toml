# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 5

[[node]]
id = 0
name = "tri"
type = "img.shape"
pos = [0.0, 0.0]
params.background = [0, 0, 0, 1]
params.centre = [0.62, 0.55]
params.fill = [1, 1, 1, 1]
params.shape = "polygon"
params.sides = 3
params.size = [0.6, 0.6]
params.softness = 0.01

[[node]]
id = 1
name = "kal"
type = "img.kaleidoscope"
pos = [220.0, 0.0]
inputs.in = { node = 0, output = "out" }
params.rotation = { value = 0.0, expr = "time * 6" }
params.segments = 12

[[node]]
id = 2
name = "grad"
type = "img.ramp"
pos = [440.0, 0.0]
params.colour_a = [0.0, 0.12, 0.16, 1]
params.colour_b = [1.0, 0.78, 0.2, 1]

[[node]]
id = 3
name = "colour"
type = "img.lookup"
pos = [660.0, 0.0]
inputs.in = { node = 1, output = "out" }
inputs.lut = { node = 2, output = "out" }

[[node]]
id = 4
name = "out"
type = "cmp.window"
pos = [880.0, 0.0]
inputs.in = { node = 3, output = "out" }
params.title = "Mandala"
