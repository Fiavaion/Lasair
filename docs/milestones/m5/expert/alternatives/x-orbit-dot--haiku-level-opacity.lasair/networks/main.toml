# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 8

[[node]]
id = 0
name = "lfo_x"
type = "sig.lfo"
pos = [0.0, 0.0]
params.amplitude = 0.3
params.frequency = 0.125
params.offset = 0.5
params.phase = 0.25

[[node]]
id = 1
name = "lfo_y"
type = "sig.lfo"
pos = [220.0, 0.0]
params.amplitude = 0.3
params.frequency = 0.125
params.offset = 0.5

[[node]]
id = 2
name = "path"
type = "sig.merge"
pos = [440.0, 0.0]
inputs.a = { node = 0, output = "out" }
inputs.b = { node = 1, output = "out" }

[[node]]
id = 3
name = "dot"
type = "img.shape"
pos = [660.0, 0.0]
params.centre = { value = [0.5, 0.5], bind = { node = 2 } }
params.size = [0.1, 0.1]
params.softness = 0.004

[[node]]
id = 4
name = "trail_fb"
type = "img.feedback"
pos = [880.0, 0.0]
inputs.loop = { node = 6, output = "out" }

[[node]]
id = 5
name = "fade"
type = "img.level"
pos = [1100.0, 0.0]
inputs.in = { node = 4, output = "out" }
params.opacity = 0.94

[[node]]
id = 6
name = "comp"
type = "img.composite"
pos = [0.0, 160.0]
inputs.a = { node = 3, output = "out" }
inputs.b = { node = 5, output = "out" }

[[node]]
id = 7
name = "win"
type = "cmp.window"
pos = [220.0, 160.0]
inputs.in = { node = 6, output = "out" }
params.title = "Orbit dot"
